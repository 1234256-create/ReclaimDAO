services:
  reclaimdao-mongodb:
    image: mongo:6.0
    container_name: reclaimdao-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: reclaimdao-db
    volumes:
      - reclaimdao_mongo_data:/data/db
    networks:
      - reclaimdao-net

  reclaimdao-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: reclaimdao-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: ${PORT:-8000}
      MONGODB_URI: ${MONGODB_URI:-mongodb://reclaimdao-mongodb:27017/reclaimdao-db}
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:-reclaimdao_secure_jwt_secret_2026}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@reclaimdao.org}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPassword123!}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-support@reclaimdao.org}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_SUPPORT: ${EMAIL_SUPPORT:-support@reclaimdao.org}
      INFO_SMTP_HOST: ${INFO_SMTP_HOST:-smtp.hostinger.com}
      INFO_SMTP_PORT: ${INFO_SMTP_PORT:-465}
      INFO_SMTP_SECURE: ${INFO_SMTP_SECURE:-true}
      INFO_SMTP_USER: ${INFO_SMTP_USER:-info@reclaimdao.org}
      INFO_SMTP_PASSWORD: ${INFO_SMTP_PASSWORD:-}
      EMAIL_INFO: ${EMAIL_INFO:-info@reclaimdao.org}
      CLIENT_URL: ${CLIENT_URL:-https://reclaimdao.org}
    depends_on:
      - reclaimdao-mongodb
    networks:
      - reclaimdao-net

  reclaimdao-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: reclaimdao-frontend
    restart: always
    ports:
      - "3080:80"
    depends_on:
      - reclaimdao-backend
    networks:
      - reclaimdao-net

networks:
  reclaimdao-net:
    driver: bridge

volumes:
  reclaimdao_mongo_data:
